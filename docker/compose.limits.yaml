# Planned readiness profiles; NOT completed benchmarks.
services:
  cpu1_ram1024:
    extends:
      file: compose.yaml
      service: readiness
    profiles: [limits]
    cpu_quota: 100000
    mem_limit: 1024m
    memswap_limit: 1024m
